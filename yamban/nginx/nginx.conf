# Yamban ERP: Nginx reverse proxy configuration
# Routes traffic to web (Next.js) and api (NestJS) containers

upstream web {
    server web:3000;
}

upstream api {
    server api:4000;
}

server {
    listen 80;
    server_name yamban-erp.local;

    # Increase client max body size for file uploads
    client_max_body_size 10M;

    # Proxy settings shared by all locations
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # API routes: forward to NestJS
    location /api/ {
        proxy_pass http://api;
    }

    # Everything else: forward to Next.js
    location / {
        proxy_pass http://web;
    }

    # Health check endpoint for the nginx container itself
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
